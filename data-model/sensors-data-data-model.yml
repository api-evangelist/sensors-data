summary: >-
  The entity graph the Sensors Data OpenAPI actually exposes, derived from schema
  definitions and id-reference fields across the four product contracts. Sensors Data does
  not publish an object reference, so entity identity is read from id-typed properties
  (83 `id`, 63 `project_id`, and the resource-specific ids below) rather than from
  documented id prefixes — there are none.

root_scope:
  entity: Project
  field: project_id
  detail: >-
    project_id appears on 63 schemas and the sensorsdata-project header is required on all
    252 operations. Project is the tenancy boundary for every other entity in the graph;
    nothing is addressable outside one. On multi-organization deployments an Organization
    sits above Project, selected by the X-Organization-Id header on 70 operations.

identity_of_a_person:
  note: >-
    A single human is addressed by three different identifiers depending on which product
    you are talking to, and reconciling them is the platform's core value proposition
    (ID Mapping).
  identifiers:
    - field: user_id
      type: int64
      meaning: the Sensors Analytics internal unique user id
    - field: first_id
      type: string
      meaning: usually the device id (anonymous)
    - field: second_id
      type: string
      meaning: usually the login id (identified)
    - field: distinct_id
      type: string
      meaning: the collected identifier on inbound events
    - field: entity_id
      type: string
      meaning: the Sensors Focus addressing key for an audience/attribute subject
    - field: send_id
      type: string
      meaning: the channel-specific delivery handle (phone number, push token)

