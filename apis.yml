name: Sensors Data
description: Sensors Data (神策数据) is a customer data analytics and CDP (Customer Data Platform) company.
  Its platform unifies customer data across channels into real-time customer profiles and provides
  product analytics, user profiling, marketing and ad attribution, A/B testing, and smart-operations
  tooling. Sensors Data processes 250+ billion data points daily, ships 50+ data-collection SDKs
  across web, mobile, mini-program and server-side languages, and serves 2,000+ enterprise customers
  with both cloud and on-premise deployment. An OpenAPI is exposed for ecosystem integration.
