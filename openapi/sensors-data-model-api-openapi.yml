          example: SERVER
          type: string
        server_time_zone:
          description: 指定使用的服务器时区，格式为 UTC+偏移量，例如：UTC+10:00
          example: UTC+10:00
          type: string
        subject_id:
          description: 多主体 ID
          example: $country
          type: string
