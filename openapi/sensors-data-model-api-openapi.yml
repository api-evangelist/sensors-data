          format: int32
          type: integer
        col_limit:
          description: 限制展示的列数
          format: int32
          type: integer
        page_size:
          description: 默认值30，表示每页展示用户数
          example: 30
          format: int32
          type: integer
        page_index:
          description: 请求的页数
          example: 2
          format: int32
          type: integer
