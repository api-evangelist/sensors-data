      properties:
        filter:
          $ref: '#/components/schemas/sensorsdata.analytics.v1.ApiRequestFilter'
        first_event:
          $ref: '#/components/schemas/sensorsdata.analytics.v1.ApiRequestEventWithFilter'
        second_event:
          $ref: '#/components/schemas/sensorsdata.analytics.v1.ApiRequestEventWithFilter'
        unit:
          description: 查看的时间粒度，可以是，HOUR：按小时，DAY：按天，WEEK：按周，MONTH：按月，YEAR：按年
          enum:
          - UNIT_TYPE_UNSPECIFIED
          - HOUR
          - DAY
          - WEEK
          - MONTH
          - YEAR
          - QUARTER
          - MINUTE
          - SECOND
          example: DAY
          type: string
        measure_type:
          description: ''
          type: string
        from_date:
          description: 查询日期范围的开始时间，格式为 yyyy-MM-dd
          example: '2022-09-29'
          type: string
        to_date:
          description: 查询日期范围的结束时间，格式为 yyyy-MM-dd
          example: '2022-09-29'
          type: string
        extend_over_end_date:
          description: ''
          type: boolean
        rollup_date:
          description: ''
          type: boolean
        use_cache:
          description: 是否使用缓存，若缓存中找不到相应数据，则从数据库读出
          example: false
          type: boolean
        quantiles:
          description: 间隔分析的指标，查询那些间隔类数据，10:P10, 25:下四分位,50:中位数,75:上四分位,90:p90
          example: '[10,25]'
          items:
            format: int32
            type: integer
          type: array
        bucket_params:
          description: 分桶条件，对数值型属性进行分组时，可以自定义分桶条件,如果不设置的话，是默认区间
          example: '{"event.$Anything.$event_duration":["40","50"]}'
          items:
            description: google.protobuf.Value 支持各种 JSON 值
            properties: {}
            type: object
          type: array
        sampling_factor:
          description: 抽样因子，64为全量，32为2分之1抽样
          example: 64
          format: int32
          type: integer
        request_id:
          description: 本次请求 ID, 方便后续追踪问题
          example: '12345696321548954'
          type: string
        by_event:
          description: 分组事件，按初始行为事件分组还是后续行为事件分组,first/second
          example: first
          type: string
        by_field:
          description: 按什么维度查看，一般是事件属性、用户属性等维度
          example: '"event.$AppStart.$country"'
          type: string
        rollup:
          description: 查询汇总或者明细数据， true：汇总，false：明细
          example: true
          type: boolean
        limit:
          description: 用户设定的返回的最大行数，如果为 null，表示自动计算一个适合前端展示的值。如果为 -1，表示在可能得情况下返回尽量多的数据。
