          description: 营收事件信息，用户在神策分析-ltv分析页面上定义的营收事件
          example: '[{"event_name":"activityview","aggregator":"average","name":"activityview的LTV_AVG","profit_rate":100}]'
          items:
            $ref: '#/components/schemas/sensorsdata.analytics.v1.ApiRequestMeasure'
