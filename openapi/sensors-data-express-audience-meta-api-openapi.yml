  /express-audience-meta/quota/query:
    get:
      description: 查询Quota
      operationId: QueryQuota
      parameters:
      - description: 全局唯一的密钥，用于验证和授权访问 API 接口
        in: header
        name: api-key
        required: true
        schema:
          type: string
      - description: 项目名, 指定请求所属项目
        in: header
        name: sensorsdata-project
        required: true
        schema:
          type: string
      - description: 租户 ID, 用于请求所属租户
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
      - description: "AudienceQuotaType枚举定义\n - BATCH_QUOTA   批受众的额度\n - REALTIME_QUOTA   实时受众的额度\n - INSTANT_QUOTA   即时受众的额度"
        in: query
        name: quota_type
        schema:
          enum:
          - AUDIENCE_QUOTA_TYPE_UNSPECIFIED
          - BATCH_QUOTA
          - REALTIME_QUOTA
          - INSTANT_QUOTA
          - REALTIME_MARK_QUOTA
          - BATCH_USER_GROUP_REFERENCE_QUOTA
          type: string
          x-sd-openapi-enum-type: com.sensorsdata.focus.v1.express.audience.open.QueryQuotaRequest.AudienceQuotaType
        x-sd-openapi-enum-type: com.sensorsdata.focus.v1.express.audience.open.QueryQuotaRequest.AudienceQuotaType
      - description: 产品线：SF或ACTIVATION. 默认为ACTIVATION, 即openapi的quota
        in: query
        name: product
        schema:
          enum:
          - PRODUCT_UNSPECIFIED
          - SF
          - ACTIVATION
          type: string
          x-sd-openapi-enum-type: com.sensorsdata.focus.v1.express.audience.AudienceProduct
        x-sd-openapi-enum-type: com.sensorsdata.focus.v1.express.audience.AudienceProduct
      responses:
        default:
          content:
            application/json:
              example:
                code: SUCCESS
                data:
                  used_count: 2
                  remained_count: 8
                request_id: '1'
              schema:
                $ref: '#/components/schemas/sensorsdata.focus.v1.QueryQuotaResponseHttpApiResult'
          description: sensorsdata.focus.v1.QueryQuotaResponse
      summary: 查询Quota
      x-sd-openapi:
        responseClass: com.sensorsdata.focus.v1.express.audience.open.QueryQuotaResponse
        isServerStreaming: false
        requestClass: com.sensorsdata.focus.v1.express.audience.open.QueryQuotaRequest
        grpcServiceBase: com.sensorsdata.focus.v1.express.audience.open.ExpressAudienceOpenServiceGrpc.ExpressAudienceOpenServiceImplBase
