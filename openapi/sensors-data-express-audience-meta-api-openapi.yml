- url: /api/v3/focus/v1
tags:
- name: Express Audience Meta
paths:
  /express-audience-meta/rule/user-group-ref/create:
    post:
      description: 创建一个分群引用受众
      operationId: CreateAudienceFilterRuleFromUserGroup
      parameters:
      - description: 全局唯一的密钥，用于验证和授权访问 API 接口
        in: header
        name: api-key
        required: true
        schema:
          type: string
      - description: 项目名, 指定请求所属项目
        in: header
        name: sensorsdata-project
        required: true
        schema:
          type: string
      - description: 租户 ID, 用于请求所属租户
        in: header
        name: X-Organization-Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sensorsdata.focus.v1.CreateAudienceFilterRuleFromUserGroupRequest'
        required: false
      responses:
        default:
          content:
            application/json:
              example:
                code: SUCCESS
                data:
                  audience_filter_rule:
                    rule_detail:
                      definition_v1:
                        user_group_reference_rule_v1: {}
                        batch_rule_v1:
                          groups:
                          - profile_dimension_user_group:
                              dimension_table:
                                predicates:
                                  simple_predicates:
                                  - measures:
                                    - sub_dimension_measure: {}
                            event_measure_user_group:
                              events:
                                condition:
                                  index: 10
                                  conditions:
                                  - function: EQUAL
                                    index: 10
                                    params:
                                    - expression: user.p1/user.p2+user.p3
                                      field: '#ResourceId'
                                      variable: $ENTRY_TIME
                                      value: {}
                                      param_type: FIELD
                                  operator: AND
                                time_range:
                                  start_time:
                                    relative_time:
                                      time_interval: {}
                            group_expression_user_group: {}
                            external_measure_user_group:
                              rows: {}
                            pql_user_group: {}
                            external_profile_user_group: {}
                            event_compound_measure_user_group:
                              measure:
                                measures:
                                - {}
                            event_sequence_user_group:
                              event_steps:
                              - {}
                            sql_user_group:
                              query_options:
                              - {}
                            profile_user_group: {}
                          tailor:
                            rank_field:
                              orders:
                              - measure:
                                  aggregator_field: {}
                          sort_info: {}
                        realtime_mark_rule_v1: {}
                        audience_rule_detail_param:
                          segment_rule_expression:
                            eql_segment_rule:
                              eql: 'user.$SegmentMembership.user_segment_t111111.is_not_null()

                                and

                                user.user_tag_c4 == ''标签值1''

                                and

                                user.vip_level in [''高级VIP'',''普通用户'']'
                            entity_set_rules:
                            - {}
                            used_fields:
                            - user.id
                            sql_segment_rule:
                              query_options:
                                option: TIMEOUT
                                value: '120'
                              sql: select user_id as id from user where user_id > 100
                            loading_segment_rule:
                              matched_field: user.$identity_login_id
                              sync_flag: false
                              loading_type: TAG_LOADING_TYPE_OVERWRITE
                            custom_rule: {}
                            event_sequence_rule:
                              simple_event_sequences:
                              - time_window:
                                  unit: DAY
                                time_range:
                                  start_time:
                                    type: RELATIVE
                                    trunc_unit: DAY
                                    base_time: $TASK_TIME
                                    time_interval: -7
                                  end_time:
                                    type: RELATIVE
                                    trunc_unit: DAY
                                    base_time: $TASK_TIME
                                    time_interval: -1
                                event_steps:
                                - condition:
                                    operator: AND
                                    conditions:
                                    - function: IS_TRUE
                                      params:
                                      - param_type: FIELD
                                        field: user.$Events.$AppStart.$is_login_id
                                  event_name: user.$Events.AppStart
                              operator: UNION
                            tailor:
                              function: LESS_EQUAL
                              rank_field:
                                type: PERCENT_ORDER_RANK
                                orders:
                                - measure:
                                    type: EQL_MEASURE_FIELD
                                    eql_measure: "user.$Events.virtual_event_for_tag.filter_event(\n  datetime_add(${var:base_time}, -1, 'DAY'),\n  datetime_add(${var:base_time}, -1, 'DAY')\n).count()"
                                  is_asc: false
                              params:
                              - param_type: VALUE
                                value:
                                  data_type: NUMBER
                                  number_value: 0.1
                            type: SQL_BASED
                            version: 2
                            group_expression_rule:
                              group_expression: $1-$2
                    schedule_conf:
                      other_trigger:
                        cron_trigger: {}
                      first_trigger: {}
                request_id: '1'
              schema:
                $ref: '#/components/schemas/sensorsdata.focus.v1.CreateAudienceFilterRuleResponseHttpApiResult'
          description: sensorsdata.focus.v1.CreateAudienceFilterRuleResponse
      summary: 创建一个分群引用受众
      x-sd-openapi:
        responseClass: com.sensorsdata.focus.v1.express.audience.open.CreateAudienceFilterRuleResponse
        isServerStreaming: false
        requestClass: com.sensorsdata.focus.v1.express.audience.open.CreateAudienceFilterRuleFromUserGroupRequest
        grpcServiceBase: com.sensorsdata.focus.v1.express.audience.open.ExpressAudienceOpenServiceGrpc.ExpressAudienceOpenServiceImplBase
        internalDesc: classes in template for grpc service dynamic invoking
        isClientStreaming: false
      x-codegen-request-body-name: CreateAudienceFilterRuleFromUserGroupRequest
      tags:
      - Express Audience Meta
