        in: header
        name: sensorsdata-project
        required: true
        schema:
          type: string
      - description: 概览类型
        example: PRIVATE
        in: query
        name: type
        schema:
          enum:
          - DASHBOARD_TYPE_UNSPECIFIED
          - PRIVATE
          - PUBLIC
          type: string
          x-sd-openapi-enum-type: com.sensorsdata.analytics.v1.DashboardType
        x-sd-openapi-enum-type: com.sensorsdata.analytics.v1.DashboardType
      - description: 本次请求 ID, 方便后续追踪问题
        example: '12345696321548954'
        in: query
        name: request_id
        schema:
          type: string
      responses:
        default:
          content:
            application/json:
              example:
                code: SUCCESS
                data:
                  dashboard_navigation_items:
                  - edit_permission: true
                    create_time: '2022-10-08 14:53:09'
                    user_id: 205
                    project_id: 1
                    user_name: 平台管理员
                    name: 数据概览
                    is_public: true
                    id: 101
                    type: 1
                    user_canme: 平台管理员
                  groups:
                  - id: '666666'
                    title: 数据概览
                    dashboards:
                    - 101
                    - 102
                  type: PRIVATE
                request_id: '1'
              schema:
                $ref: '#/components/schemas/sensorsdata.analytics.v1.DashboardNavigationResponseHttpApiResult'
          description: sensorsdata.analytics.v1.DashboardNavigationResponse
      summary: 获取所有的概览分组信息
      x-sd-openapi:
        responseClass: com.sensorsdata.analytics.v1.DashboardNavigationResponse
        isServerStreaming: false
        requestClass: com.sensorsdata.analytics.v1.DashboardsRequest
        grpcServiceBase: com.sensorsdata.analytics.v1.DashboardServiceGrpc.DashboardServiceImplBase
        internalDesc: classes in template for grpc service dynamic invoking
        isClientStreaming: false
      tags:
      - Dashboard
  /dashboard/lego:
