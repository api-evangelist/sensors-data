    sensorsdata.common.PredicateFunctionParam:
      description: "```\n 函数的参数，有几种可能\n 1. 一个 field, 如 events.$Anything.$city\n 2. 一个 Literal 的常量\n 3.\
        \ 一个变量, 如 $ENTRY_TIME, 需要在执行上下文里进行替换\n 4. 一个 TimePoint, 代表一个相对或绝对的时间点, 用于时间类型的条件\n 5. 一个 expression\
        \ user.p1/user.p2+user.p3\n ```"
      properties:
        param_type:
          description: 函数的参数类型
          enum:
          - FUNCTION_PARAM_TYPE_UNSPECIFIED
          - FIELD
          - VALUE
          - VARIABLE
          - TIME_POINT
          - EXPRESSION
          example: FIELD
          type: string
        field:
          description: 字段名
          example: '#ResourceId'
          type: string
        value:
          $ref: '#/components/schemas/sensorsdata.common.Literal'
        variable:
          description: 变量，需要在执行上下文里进行替换
          example: $ENTRY_TIME
          type: string
        time_point:
          $ref: '#/components/schemas/sensorsdata.common.TimePoint'
        expression:
          description: 自定义表达式
          example: user.p1/user.p2+user.p3
          type: string
      title: PredicateFunctionParam
      type: object
    sensorsdata.horizon.v1.SegmentRuleExpression:
      description: ''
      properties:
        type:
          description: "分群规则类型\n```\n  SQL_BASED: 基于 SQL 的分群规则\n  EQL_BASED: 基于 EQL 的分群规则\n  LOADING_BASED:\
            \ 基于文件加载的分群规则\n  CUSTOM_BASED: 基于自定义组件的分群规则\n  EVENT_SEQUENCE_BASED: 基于行为序列的分群规则\n  GROUP_EXPRESSION_BASED:\
            \ 基于规则组的分群规则\n  ALL: 表示全部实体, 该类型比较特殊, 无实际的规则信息。\n```"
          enum:
          - SIMPLE_USER_GROUP_TYPE_UNSPECIFIED
          - SQL_BASED
          - EQL_BASED
          - LOADING_BASED
          - CUSTOM_BASED
          - EVENT_SEQUENCE_BASED
          - GROUP_EXPRESSION_BASED
          - ALL
          example: SQL_BASED
          type: string
        sql_segment_rule:
          $ref: '#/components/schemas/sensorsdata.horizon.v1.SqlSegmentRuleExpression'
        eql_segment_rule:
          $ref: '#/components/schemas/sensorsdata.horizon.v1.EqlSegmentRuleExpression'
        loading_segment_rule:
          $ref: '#/components/schemas/sensorsdata.horizon.v1.LoadingSegmentRuleExpression'
        custom_rule:
          $ref: '#/components/schemas/sensorsdata.horizon.v1.CustomSegmentRuleExpression'
        event_sequence_rule:
          $ref: '#/components/schemas/sensorsdata.horizon.v1.EventSequenceSegmentRuleExpression'
        group_expression_rule:
          $ref: '#/components/schemas/sensorsdata.horizon.v1.GroupExpressionSegmentRuleExpression'
        virtual:
          description: "是否是虚拟分群, 如果是虚拟分群则不会执行 SQL 存储分群结果\n LoadingSegmentRuleExpression 不能为虚拟分群"
          type: boolean
        tailor:
          $ref: '#/components/schemas/sensorsdata.horizon.v1.Tailor'
        entity_set_rules:
          description: "实体范围数组, 实体范围之间的关系为 \"OR/或\" 关系\n 保存规则的时候, SegmentRule 只需要填充 id\n 查询返回的时候, gRPC\
            \ 会返回 id、display_name、expression、version、rule_available、delete_flag"
          items:
            $ref: '#/components/schemas/sensorsdata.horizon.v1.SegmentRule'
          type: array
        time_zone:
          description: 规则时区, 设置之后事件规则中 time 及 时间类型事件属性计算时会相对服务器时区发生偏移, 数据样例：UTC+11:00
          type: string
        version:
          description: 分群规则版本, 从 sps 升级带上来的规则为 1 (QE 和 老PB), 在 horizon 新组件创建出来的为 2， openApi创建的时候，固定传2
          example: 2
          format: int32
          type: integer
        used_fields:
          description: 规则引用到的字段
          example: '["user.id"]'
          items:
            type: string
          type: array
      title: SegmentRuleExpression
      type: object
