                          event_sequence_user_group:
                            event_steps:
                            - {}
                          sql_user_group:
                            query_options:
                            - {}
                          profile_user_group: {}
                        tailor:
                          rank_field:
                            orders:
                            - measure:
                                aggregator_field: {}
                        sort_info: {}
                      audience_rule_detail_param:
                        segment_rule_expression:
                          eql_segment_rule:
                            eql: 'user.$SegmentMembership.user_segment_t111111.is_not_null()

                              and

                              user.user_tag_c4 == ''标签值1''

                              and

                              user.vip_level in [''高级VIP'',''普通用户'']'
                          entity_set_rules:
                          - {}
                          used_fields:
                          - user.id
                          sql_segment_rule:
                            query_options:
                              option: TIMEOUT
                              value: '120'
                            sql: select user_id as id from user where user_id > 100
                          loading_segment_rule:
                            matched_field: user.$identity_login_id
                            sync_flag: false
                            loading_type: TAG_LOADING_TYPE_OVERWRITE
                          custom_rule: {}
                          event_sequence_rule:
                            simple_event_sequences:
                            - time_window:
                                unit: DAY
                              time_range:
                                start_time:
                                  type: RELATIVE
                                  trunc_unit: DAY
                                  base_time: $TASK_TIME
                                  time_interval: -7
                                end_time:
                                  type: RELATIVE
                                  trunc_unit: DAY
                                  base_time: $TASK_TIME
                                  time_interval: -1
                              event_steps:
                              - condition:
                                  operator: AND
                                  conditions:
                                  - function: IS_TRUE
                                    params:
                                    - param_type: FIELD
                                      field: user.$Events.$AppStart.$is_login_id
                                event_name: user.$Events.AppStart
                            operator: UNION
                          tailor:
                            function: LESS_EQUAL
                            rank_field:
                              type: PERCENT_ORDER_RANK
                              orders:
                              - measure:
                                  type: EQL_MEASURE_FIELD
                                  eql_measure: "user.$Events.virtual_event_for_tag.filter_event(\n  datetime_add(${var:base_time},\
                                    \ -1, 'DAY'),\n  datetime_add(${var:base_time}, -1, 'DAY')\n).count()"
                                is_asc: false
                            params:
                            - param_type: VALUE
                              value:
                                data_type: NUMBER
                                number_value: 0.1
                          type: SQL_BASED
                          version: 2
                          group_expression_rule:
                            group_expression: $1-$2
                    msg_send_config: {}
                  events:
                  - {}
                request_id: '1'
              schema:
